<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>

FUOYE Security Login

</title>

<link rel="stylesheet"

href="{{ url_for('static',
filename='css/login.css') }}">

</head>

<body>

<div class="login-box">

    <img

    src="{{ url_for('static',
    filename='images/fuoye.jpg') }}"

    class="logo">

    <h2>

        Real-Time Campus Security

    </h2>

    <p>

        Administrator Login

    </p>

    <form

    action="/login"

    method="POST">

    {% if error %}

<div class="error">

    {{ error }}

</div>

{% endif %}

        <input

        type="text"

        name="username"

        placeholder="Username"

        required>

        <input

        type="password"

        name="password"

        placeholder="Password"

        required>

        <button>

            LOGIN

        </button>

    </form>

</div>

</body>

</html>
